<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Crypto Whale Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <style>
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }
    .float { animation: float 3s ease-in-out infinite; }
  </style>
</head>
<body class="min-h-screen bg-gray-950 antialiased">
  <div class="min-h-screen flex flex-col items-center justify-center px-4 text-center">
    <div class="float text-8xl mb-4">🐋</div>
    <div class="text-8xl font-bold bg-gradient-to-r from-cyan-500 to-blue-600 bg-clip-text text-transparent mb-4">404</div>
    <h1 class="text-2xl font-semibold text-white mb-2">Page Not Found</h1>
    <p class="text-gray-400 mb-8 max-w-md">The page you're looking for doesn't exist or has been moved. Let's get you back to tracking whales!</p>
    <a href="/" class="inline-flex items-center gap-2 px-6 py-3 bg-gradient-to-r from-cyan-500 to-blue-600 text-white rounded-lg font-medium hover:shadow-lg hover:shadow-cyan-500/30 transition-all hover:-translate-y-0.5">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
      </svg>
      Back to Dashboard
    </a>
    <div class="flex items-center gap-4 mt-8 text-gray-500 text-sm">
      <a href="/" class="hover:text-cyan-400 transition-colors">Home</a>
      <span>•</span>
      <a href="https://github.com/heidiweidi/cryptowhaletracker" class="hover:text-cyan-400 transition-colors">GitHub</a>
    </div>
  </div>
</body>
</html>
